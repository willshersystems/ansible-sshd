# SPDX-License-Identifier: MIT
---
argument_specs:
  main:
    short_description: The sshd role.
    description: >
      The sshd role allows you to configure the OpenSSH server
      daemon. It installs the required packages and writes an
      `sshd_config` file, or a namespaced snippet inside an existing
      file, from the options given to the role.

      The role can also manage the sshd service, systemd socket
      activation, host keys, firewall and SELinux ports, and SSH
      certificate authentication files.
    options:
      sshd_enable:
        type: bool
        default: true
        description: >
          Whether the role runs. When `false`, the role does nothing.
      sshd_enable_fingerprint:
        type: bool
        default: false
        description: >
          Whether to record begin and success fingerprints in the
          system log. The messages are written through syslog and
          show up in `journalctl` on systemd hosts.
      sshd_skip_defaults:
        type: bool
        default: false
        description: >
          Whether to omit OS default values from the generated
          configuration. When `true`, every option that should appear
          in the file must be supplied through `sshd_config` or an
          `sshd_<OptionName>` variable.
      sshd_manage_service:
        type: bool
        default: true
        description: >
          Whether to manage the sshd service, including enabling it
          on boot and starting or reloading it.
      sshd_allow_daemon_reload:
        type: bool
        default: true
        description: >
          Whether to reload the systemd manager configuration when a
          service, socket, or listen change requires it.
      sshd_allow_reload:
        type: bool
        default: true
        description: >
          Whether to reload sshd when the configuration changes.
      sshd_allow_restart:
        type: bool
        default: true
        description: >
          Whether to restart sshd when a change requires a full
          restart, such as an update of the sysconfig or environment
          file.
      sshd_socket_allow_restart:
        type: bool
        default: true
        description: >
          Whether to restart the sshd socket unit when the socket
          unit or the configured ports and listen addresses change.
      sshd_install_service:
        type: bool
        default: false
        description: >
          Whether to install systemd service and socket unit files
          from the templates named by `sshd_service_template_service`,
          `sshd_service_template_at_service`, and
          `sshd_service_template_socket`.
      sshd_service_template_service:
        type: str
        default: sshd.service.j2
        description: >
          The role template for the sshd systemd service unit,
          installed when `sshd_install_service` is `true`.
      sshd_service_template_at_service:
        type: str
        default: sshd@.service.j2
        description: >
          The role template for the instantiated sshd systemd service
          unit, installed when `sshd_install_service` is `true`.
      sshd_service_template_socket:
        type: str
        default: sshd.socket.j2
        description: >
          The role template for the sshd systemd socket unit,
          installed when `sshd_install_service` is `true`.
      sshd_backup:
        type: bool
        default: true
        description: >
          Whether to keep a backup of an existing file before the
          role overwrites it.
      sshd_sysconfig:
        type: bool
        default: false
        description: >
          Whether to manage `/etc/sysconfig/sshd` on RHEL-based
          systems that support a sysconfig file for sshd.
      sshd_sysconfig_override_crypto_policy:
        type: bool
        default: false
        description: >
          Whether `/etc/sysconfig/sshd` sets
          `CRYPTO_POLICY=`. When `true`, sshd uses the ciphers,
          MACs, and public key algorithms from its own configuration
          instead of the system-wide crypto policy.
      sshd_sysconfig_use_strong_rng:
        type: int
        default: 0
        description: >
          How many bytes sshd reads from the kernel random source to
          reseed the OpenSSL random number generator. `0` disables
          reseeding. Any other value must be at least `14`. Applies
          on RHEL-based systems that support `SSH_USE_STRONG_RNG`.
      sshd_config_file:
        type: path
        default: "{{ __sshd_config_file }}"
        description: >
          The path of the configuration file written by the role.
          A path in the drop-in directory, such as
          `/etc/ssh/sshd_config.d/00-custom.conf`, selects a snippet
          instead of the main configuration file.
      sshd_trusted_user_ca_keys_list:
        type: list
        elements: str
        default: []
        description: >
          Trusted user CA public keys in OpenSSH one-line format.
          Each item is one public key. The role writes them to the
          `TrustedUserCAKeys` file.
      sshd_principals:
        type: dict
        default: {}
        description: >
          Mapping of local user names to the certificate principals
          accepted for that user. Each value is a list of principal
          names, such as `frontend-admin`. The role writes one
          authorized-principals file per user.
      sshd_packages:
        type: list
        elements: str
        default: "{{ __sshd_packages }}"
        description: >
          Package names to install for the OpenSSH server.
      sshd_config_owner:
        type: str
        default: "{{ __sshd_config_owner }}"
        description: >
          The user name or user id that owns the generated
          configuration file.
      sshd_config_group:
        type: str
        default: "{{ __sshd_config_group }}"
        description: >
          The group name or group id that owns the generated
          configuration file.
      sshd_config_mode:
        type: raw
        default: "{{ __sshd_config_mode }}"
        description: >
          The file mode of the generated configuration file. Accepts
          a string such as `0600` or an integer.
      sshd_binary:
        type: path
        default: "{{ __sshd_binary }}"
        description: >
          The path to the sshd executable.
      sshd_service:
        type: str
        default: "{{ __sshd_service }}"
        description: >
          The sshd service name. Also used as the unit name when
          `sshd_install_service` installs custom unit files.
      sshd_sftp_server:
        type: path
        default: "{{ __sshd_sftp_server }}"
        description: >
          The path to the sftp-server binary.
      sshd_drop_in_dir_mode:
        type: raw
        default: "{{ __sshd_drop_in_dir_mode }}"
        description: >
          The file mode of the sshd drop-in configuration directory.
          Accepts a string such as `0755` or an integer.
      sshd_main_config_file:
        type: raw
        default: "{{ __sshd_main_config_file }}"
        description: >
          The path of the main `sshd_config` file that should contain
          an `Include` directive when `sshd_config_file` points into
          a drop-in directory. Accepts a path, or `null` when there
          is no separate main file to update.
      sshd_trustedusercakeys_directory_owner:
        type: str
        default: "{{ __sshd_trustedusercakeys_directory_owner }}"
        description: >
          The user name or user id that owns the trusted user CA keys
          directory.
      sshd_trustedusercakeys_directory_group:
        type: str
        default: "{{ __sshd_trustedusercakeys_directory_group }}"
        description: >
          The group name or group id that owns the trusted user CA
          keys directory.
      sshd_trustedusercakeys_directory_mode:
        type: raw
        default: "{{ __sshd_trustedusercakeys_directory_mode }}"
        description: >
          The file mode of the trusted user CA keys directory.
          Accepts a string such as `0755` or an integer.
      sshd_trustedusercakeys_file_owner:
        type: str
        default: "{{ __sshd_trustedusercakeys_file_owner }}"
        description: >
          The user name or user id that owns the trusted user CA keys
          file.
      sshd_trustedusercakeys_file_group:
        type: str
        default: "{{ __sshd_trustedusercakeys_file_group }}"
        description: >
          The group name or group id that owns the trusted user CA
          keys file.
      sshd_trustedusercakeys_file_mode:
        type: raw
        default: "{{ __sshd_trustedusercakeys_file_mode }}"
        description: >
          The file mode of the trusted user CA keys file. Accepts a
          string such as `0640` or an integer.
      sshd_authorizedprincipals_directory_owner:
        type: str
        default: "{{ __sshd_authorizedprincipals_directory_owner }}"
        description: >
          The user name or user id that owns the authorized
          principals directory.
      sshd_authorizedprincipals_directory_group:
        type: str
        default: "{{ __sshd_authorizedprincipals_directory_group }}"
        description: >
          The group name or group id that owns the authorized
          principals directory.
      sshd_authorizedprincipals_directory_mode:
        type: raw
        default: "{{ __sshd_authorizedprincipals_directory_mode }}"
        description: >
          The file mode of the authorized principals directory.
          Accepts a string such as `0755` or an integer.
      sshd_authorizedprincipals_file_owner:
        type: str
        default: "{{ __sshd_authorizedprincipals_file_owner }}"
        description: >
          The user name or user id that owns each authorized
          principals file.
      sshd_authorizedprincipals_file_group:
        type: str
        default: "{{ __sshd_authorizedprincipals_file_group }}"
        description: >
          The group name or group id that owns each authorized
          principals file.
      sshd_authorizedprincipals_file_mode:
        type: raw
        default: "{{ __sshd_authorizedprincipals_file_mode }}"
        description: >
          The file mode of each authorized principals file. Accepts a
          string such as `0644` or an integer.
      sshd_verify_hostkeys:
        type: raw
        default: "auto"
        description: >
          Which host private keys the role checks and creates before
          starting sshd. Accepts `auto` to use the keys rendered into
          the configuration, or the platform default set when none
          are configured. Accepts `false` or an empty list to skip
          the check, or a list of host key paths such as
          `/etc/ssh/ssh_host_rsa_key`.
      sshd_hostkey_owner:
        type: str
        default: "{{ __sshd_hostkey_owner }}"
        description: >
          The user name or user id that owns the host private keys
          checked by `sshd_verify_hostkeys`.
      sshd_hostkey_group:
        type: str
        default: "{{ __sshd_hostkey_group }}"
        description: >
          The group name or group id that owns the host private keys
          checked by `sshd_verify_hostkeys`.
      sshd_hostkey_mode:
        type: raw
        default: "{{ __sshd_hostkey_mode }}"
        description: >
          The file mode of the host private keys checked by
          `sshd_verify_hostkeys`. Accepts a string such as `0600` or
          an integer.
      sshd_config_namespace:
        type: raw
        default: null
        description: >
          The namespace under which configuration snippets are
          inserted into an existing configuration file. Accepts a
          string, or `null` to write the whole configuration file.
          Each invocation has its own namespace when the role runs
          more than once.
      sshd_manage_firewall:
        type: bool
        default: false
        description: >
          Whether to open the configured SSH ports in the firewall.
          This only adds ports, and only on Red Hat based systems.
      sshd_manage_selinux:
        type: bool
        default: false
        description: >
          Whether to allow sshd to bind the configured ports in
          SELinux. This only adds policy, and only on Red Hat based
          systems.
      sshd_systemd_unit:
        type: str
        default: "{{ __sshd_systemd_unit }}"
        choices:
          - service
          - socket
        description: >
          Which systemd unit handles incoming SSH connections.
          `service` runs sshd as a long-running service. `socket`
          uses socket activation. Only one of the two can be active.

      sshd:
        type: dict
        description: >
          Deprecated dict of OpenSSH options. Same shape as
          `sshd_config`. Use `sshd_config` instead.
      sshd_config:
        type: dict
        description: >
          OpenSSH options keyed by the name documented in
          `sshd_config(5)`, such as `PermitRootLogin` or
          `ListenAddress`. A value can be a boolean, a string, a
          number, a list, or `null`. The `Match` key accepts one
          dict or a list of dicts, and each dict must contain a
          `Condition` key.
      sshd_Include:
        type: raw
        description: >
          Value of the OpenSSH `Include` option. Accepts a boolean,
          a string, a number, a list, or `null`. When set, it
          overrides the same key in `sshd_config`.
      sshd_Port:
        type: raw
        description: >
          Value of the OpenSSH `Port` option. Accepts a boolean,
          a string, a number, a list, or `null`. When set, it
          overrides the same key in `sshd_config`.
      sshd_AddressFamily:
        type: raw
        description: >
          Value of the OpenSSH `AddressFamily` option. Accepts a boolean,
          a string, a number, a list, or `null`. When set, it
          overrides the same key in `sshd_config`.
      sshd_ListenAddress:
