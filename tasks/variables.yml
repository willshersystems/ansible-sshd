---
- name: Ensure ansible_facts used by role
  ansible.builtin.setup:
    gather_subset:
      - min
      - virtual
  when: __sshd_required_facts |
    difference(ansible_facts.keys() | list) | length > 0
  no_log: "{{ ansible_verbosity < 3 }}"

- name: Record role begin fingerprint
  sr_fingerprint:
    status: begin
    role_name: willshersystems:ansible-sshd
    role_path: "{{ role_path }}"
    ansible_play_hosts_all: "{{ ansible_play_hosts_all }}"
    distribution: "{{ ansible_facts['distribution'] }}"
    distribution_version: "{{ ansible_facts['distribution_version'] }}"
    write_log_file: "{{ __sshd_write_log_file }}"
  when: sshd_enable_fingerprint | bool

- name: Determine if system is ostree and set flag
  when: not __sshd_is_ostree is defined
  block:
    - name: Check if system is ostree
      ansible.builtin.stat:
        path: /run/ostree-booted
      register: __ostree_booted_stat

    - name: Set flag to indicate system is ostree
      ansible.builtin.set_fact:
        __sshd_is_ostree: "{{ __ostree_booted_stat.stat.exists }}"

- name: Set OS dependent variables
  ansible.builtin.include_vars: "{{ item }}"
  vars:
    _distribution_lts_offset: >-
      {{
        ansible_facts['distribution_major_version'] | int % 2
        if ansible_facts['distribution'] == "Ubuntu"
        else 0
      }}
    _distribution_lts_version: >-
      {{
        ansible_facts['distribution_major_version'] | int -
        _distribution_lts_offset | int
        if ansible_facts['distribution'] == "Ubuntu"
        else ansible_facts['distribution_version']
      }}
  with_first_found:
    - files:
        - "{{ ansible_facts['distribution'] }}_{{ _distribution_lts_version }}.yml"
        - "{{ ansible_facts['os_family'] }}_{{ ansible_facts['distribution_major_version'] | replace('/', '-') }}.yml"
        - "{{ ansible_facts['distribution'] }}.yml"
        - "{{ ansible_facts['os_family'] }}.yml"
      paths:
        - "{{ role_path }}/vars"
        - "{{ playbook_dir }}/vars"
      skip: true
