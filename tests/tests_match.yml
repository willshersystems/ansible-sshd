---
- name: Test match blocks
  hosts: all
  vars:
    __sshd_test_backup_files:
      - /etc/ssh/sshd_config
      - /etc/ssh/sshd_config.d/00-ansible_system_role.conf
  tasks:
    - name: "Backup configuration files"
      ansible.builtin.include_tasks: tasks/backup.yml

    - name: Configure sshd
      ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml
      vars:
        # For Fedora containers, we need to make sure we have keys for sshd -T below
        sshd_verify_hostkeys:
          - /etc/ssh/ssh_host_rsa_key
        sshd_config:
          Match:
            Condition: "User xusers"
            X11Forwarding: true
            Banner: /tmp/xusers-banner
        sshd_match:
          - Condition: "User bot"
            AllowTcpForwarding: false
            Banner: /tmp/bot-banner
        sshd_match_1:
          - Condition: "User sftponly"
            ForceCommand: "internal-sftp"
            ChrootDirectory: "/var/uploads/"
        sshd_match_2:
          - Condition: "User root"
            PasswordAuthentication: false
            AllowTcpForwarding: true

    - name: Verify the options are correctly set
      tags: tests::verify
      block:
        - name: Flush handlers
          ansible.builtin.meta: flush_handlers

        - name: List effective configuration using sshd -T for xusers
          ansible.builtin.include_tasks: tasks/get_sshd_options.yml
          vars:
            __sshd_connection_spec: user=xusers,addr=127.0.0.1,host=example.com
            __sshd_output_variable_name: xusers_effective

        - name: List effective configuration using sshd -T for bot
          ansible.builtin.include_tasks: tasks/get_sshd_options.yml
          vars:
            __sshd_connection_spec: user=bot,addr=127.0.0.1,host=example.com
            __sshd_output_variable_name: bot_effective

        - name: List effective configuration using sshd -T for sftponly
          ansible.builtin.include_tasks: tasks/get_sshd_options.yml
          vars:
            __sshd_connection_spec: user=sftponly,addr=127.0.0.1,host=example.com
            __sshd_output_variable_name: sftponly_effective

        - name: List effective configuration using sshd -T for root
          ansible.builtin.include_tasks: tasks/get_sshd_options.yml
          vars:
            __sshd_connection_spec: user=root,addr=127.0.0.1,host=example.com
            __sshd_output_variable_name: root_effective

        - name: Print current configuration file
          ansible.builtin.slurp:
            src: "{{ main_sshd_config }}"
          register: config

        - name: Check the options are effective
          # sshd -T output option names are normalized to lowercase
          ansible.builtin.assert:
            that:
              - "'x11forwarding yes' in xusers_effective.stdout"
              - "'banner /tmp/xusers-banner' in xusers_effective.stdout"
              - "'allowtcpforwarding no' in bot_effective.stdout"
              - "'banner /tmp/bot-banner' in bot_effective.stdout"
              - "'forcecommand internal-sftp' in sftponly_effective.stdout"
              - "'chrootdirectory /var/uploads/' in sftponly_effective.stdout"
              - "'passwordauthentication no' in root_effective.stdout"
              - "'allowtcpforwarding yes' in root_effective.stdout"

        - name: Check the options are in configuration file
          ansible.builtin.assert:
            that:
              - "'Match User xusers' in config.content | b64decode"
              - "'Match User bot' in config.content | b64decode"
              - "'Match User sftponly' in config.content | b64decode"
              - "'Match User root' in config.content | b64decode"

    - name: "Restore configuration files"
      ansible.builtin.include_tasks: tasks/restore.yml

- name: Test the spellings of X11UseLocalhost in match blocks
  hosts: all
  vars:
    __sshd_test_backup_files:
      - /etc/ssh/sshd_config
      - /etc/ssh/sshd_config.d/00-ansible_system_role.conf
  tasks:
    - name: "Backup configuration files"
      ansible.builtin.include_tasks: tasks/backup.yml

    - name: Configure sshd
      ansible.builtin.include_tasks: tasks/run_role_with_clear_facts.yml
      vars:
        # For Fedora containers, we need to make sure we have keys for sshd -T below
        sshd_verify_hostkeys:
          - /etc/ssh/ssh_host_rsa_key
        sshd_config:
          X11UseLocalhost: true
        sshd_match:
          - Condition: "User carol"
            X11UseLocalhost: false
        # the misspelling that was always accepted in match blocks
        sshd_match_1:
          - Condition: "User dave"
            X11UseLocalHost: false
        # sshd uses the first value, which is the one of the correct spelling
        sshd_match_2:
          - Condition: "User erin"
            X11UseLocalhost: false
            X11UseLocalHost: true

    - name: Verify the options are correctly set
      tags: tests::verify
      block:
        - name: Flush handlers
          ansible.builtin.meta: flush_handlers

        - name: List effective configuration using sshd -T for carol
          ansible.builtin.include_tasks: tasks/get_sshd_options.yml
          vars:
            __sshd_connection_spec: user=carol,addr=127.0.0.1,host=example.com
            __sshd_output_variable_name: carol_effective

        - name: Check the effective setting for carol
          ansible.builtin.assert:
            that:
              - "'x11uselocalhost no' in carol_effective.stdout_lines"

        - name: List effective configuration using sshd -T for dave
          ansible.builtin.include_tasks: tasks/get_sshd_options.yml
          vars:
            __sshd_connection_spec: user=dave,addr=127.0.0.1,host=example.com
            __sshd_output_variable_name: dave_effective

        - name: Check the effective setting for dave
          ansible.builtin.assert:
            that:
              - "'x11uselocalhost no' in dave_effective.stdout_lines"

        - name: List effective configuration using sshd -T for erin
          ansible.builtin.include_tasks: tasks/get_sshd_options.yml
          vars:
            __sshd_connection_spec: user=erin,addr=127.0.0.1,host=example.com
            __sshd_output_variable_name: erin_effective

        - name: Check the effective setting for erin
          ansible.builtin.assert:
            that:
              - "'x11uselocalhost no' in erin_effective.stdout_lines"

        - name: List effective configuration using sshd -T for frank
          ansible.builtin.include_tasks: tasks/get_sshd_options.yml
          vars:
            __sshd_connection_spec: user=frank,addr=127.0.0.1,host=example.com
            __sshd_output_variable_name: frank_effective

        - name: Check the effective setting for frank
          ansible.builtin.assert:
            that:
              - "'x11uselocalhost yes' in frank_effective.stdout_lines"

    - name: "Restore configuration files"
      ansible.builtin.include_tasks: tasks/restore.yml
