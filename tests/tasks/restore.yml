---
- name: Restore backed up files and remove what was not present
  ansible.builtin.shell: |
    set -eu
    if set -o | grep pipefail 2>&1 /dev/null ; then
      set -o pipefail
    fi
    if test -e {{ __sshd_test_backup.path | quote }}/{{ item | quote }} -o -L {{ __sshd_test_backup.path | quote }}/{{ item | quote }}; then
      cp -a {{ __sshd_test_backup.path | quote }}/{{ item | quote }} $(dirname {{ item | quote }})
    elif test -e {{ item | quote }} -o -L {{ item | quote }}; then
      rm {{ item | quote }}
    fi
  changed_when: false
  loop: "{{ __sshd_test_backup_files | d([]) }}"
  when:
    - __sshd_test_backup is defined
    - __sshd_test_backup.path is defined

- name: Remove temporary directory for backup files
  ansible.builtin.file:
    path: "{{ __sshd_test_backup.path }}"
    state: absent
  changed_when: false
  when:
    - __sshd_test_backup is defined
    - __sshd_test_backup.path is defined

- name: Include common variables
  ansible.builtin.include_role:
    name: ansible-sshd
    tasks_from: variables.yml
    public: true

# The restore above manipulates unit files directly on disk (raw cp/rm),
# bypassing systemd. If the test run masked a unit (e.g. sshd.service when
# sshd_systemd_unit: socket was forced), systemd's unit database still
# considers it masked until it re-reads the units from disk, even though
# the real unit file has already been restored. Without this, the restart
# below fails with "Unit sshd.service is masked".
- name: Reload systemd manager configuration
  ansible.builtin.systemd:
    daemon_reload: true
  changed_when: false
  when:
    - ansible_facts['service_mgr'] == 'systemd' or
      (ansible_facts['os_family'] == 'RedHat' and ansible_facts['distribution_major_version'] == '7')
    - ansible_facts['virtualization_type'] | default(None) not in __sshd_skip_virt_env
    - ansible_connection != 'chroot'

- name: Restart sshd service
  ansible.builtin.service:
    name: sshd
    state: reloaded
  changed_when: false
  when:
    - __sshd_test_backup is defined
    - ansible_facts['virtualization_type'] | default(None) not in __sshd_skip_virt_env
    - ansible_connection != 'chroot'
    - ansible_facts['os_family'] != 'AIX'
